<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradiente de Fondo Oscuro Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Gradientes de Marca -->
    <linearGradient id="brandEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="brandBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Filtros de Resplandor Neón -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Líneas Técnicas de Cuadrícula Tecnológica -->
  <g stroke="#1F2430" stroke-width="1" opacity="0.35">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Orbes de Luz de Fondo -->
  <circle cx="1060" cy="180" r="260" fill="#10B981" opacity="0.12" filter="url(#emeraldGlow)" />
  <circle cx="180" cy="520" r="240" fill="#3B82F6" opacity="0.10" filter="url(#blueGlow)" />

  <!-- LADO IZQUIERDO: Branding y Mensaje Principal -->
  <g transform="translate(100, 80)">
    <!-- Header con Flecha GPS de Navegación Exacta -->
    <g>
      <rect width="72" height="72" rx="20" fill="#161B22" stroke="#21262D" stroke-width="2" />
      <!-- Flecha GPS centrada -->
      <g transform="translate(36, 36) scale(1.9) translate(-12, -12)">
        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" fill="#FFFFFF" />
        <circle cx="12" cy="3" r="1.8" fill="#10B981" />
      </g>
      <text x="94" y="44" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
        Ruta Libre
      </text>
      <text x="94" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10B981" letter-spacing="0.08em">
        RED P2P DESCENTRALIZADA
      </text>
    </g>

    <!-- Título Principal -->
    <text x="0" y="180" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      Transporte 100% Real
    </text>
    <text x="0" y="246" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#brandEmeraldGrad)" letter-spacing="-0.03em">
      Sin Comisiones Abusivas
    </text>

    <!-- Subtítulo -->
    <text x="0" y="310" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="-0.01em">
      Viaja o Conduce con negociación directa en efectivo,
    </text>
    <text x="0" y="338" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="-0.01em">
      mapas en tiempo real y GPS continuo sin intermediarios.
    </text>

    <!-- 3 Pills de Características Clave -->
    <g transform="translate(0, 385)">
      <!-- Pill 1: 0% Comisión -->
      <g>
        <rect width="180" height="42" rx="21" fill="#161B22" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
        <circle cx="24" cy="21" r="6" fill="#10B981" />
        <text x="40" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
          0% Comisiones
        </text>
      </g>

      <!-- Pill 2: Efectivo Directo -->
      <g transform="translate(196, 0)">
        <rect width="185" height="42" rx="21" fill="#161B22" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4" />
        <circle cx="24" cy="21" r="6" fill="#3B82F6" />
        <text x="40" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
          Efectivo Directo
        </text>
      </g>

      <!-- Pill 3: GPS en Vivo -->
      <g transform="translate(397, 0)">
        <rect width="160" height="42" rx="21" fill="#161B22" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" />
        <circle cx="24" cy="21" r="6" fill="#F59E0B" />
        <text x="40" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
          GPS en Vivo
        </text>
      </g>
    </g>
  </g>

  <!-- LADO DERECHO: Tarjetas Flotantes de Doble App (Pasajero + Conductor) -->
  <g transform="translate(740, 95)">
    <!-- TARJETA 1: RUTA LIBRE DRIVER (Modo Conductor) -->
    <g>
      <rect width="360" height="205" rx="24" fill="#161B22" stroke="#21262D" stroke-width="2" />
      <rect x="0" y="0" width="360" height="6" rx="3" fill="#10B981" />

      <!-- Header Conductor -->
      <g transform="translate(24, 28)">
        <rect width="40" height="40" rx="12" fill="#10B981" opacity="0.15" />
        <g transform="translate(20, 20) scale(1.1) translate(-12, -12)">
          <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" fill="#10B981" />
        </g>
        <text x="54" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
          Ruta Libre Driver
        </text>
        <text x="54" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#10B981">
          RADAR DE OFERTAS ACTIVO
        </text>
      </g>

      <!-- Estadísticas de Conductor -->
      <g transform="translate(24, 88)">
        <rect width="312" height="88" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1" />
        
        <g transform="translate(18, 20)">
          <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="0.05em">GANANCIAS HOY</text>
          <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" fill="#10B981">$72.500</text>
          <text x="105" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8B949E">COP</text>
        </g>

        <g transform="translate(185, 20)">
          <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="0.05em">COMISIÓN PAGADA</text>
          <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" fill="#FFFFFF">$0 COP</text>
        </g>
      </g>
    </g>

    <!-- TARJETA 2: RUTA LIBRE (Modo Pasajero) -->
    <g transform="translate(0, 225)">
      <rect width="360" height="195" rx="24" fill="#161B22" stroke="#21262D" stroke-width="2" />
      <rect x="0" y="0" width="360" height="6" rx="3" fill="#3B82F6" />

      <!-- Header Pasajero -->
      <g transform="translate(24, 26)">
        <rect width="40" height="40" rx="12" fill="#3B82F6" opacity="0.15" />
        <circle cx="20" cy="20" r="7" fill="#3B82F6" />
        <circle cx="20" cy="20" r="3" fill="#FFFFFF" />

        <text x="54" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
          Ruta Libre Viajero
        </text>
        <text x="54" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#3B82F6">
          TÚ DECIDES TU TARIFA
        </text>
      </g>

      <!-- Ruta y Oferta -->
      <g transform="translate(24, 82)">
        <rect width="312" height="85" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1" />
        
        <g transform="translate(16, 22)">
          <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">El Poblado ➔ CC Santafé</text>
          <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#8B949E">Auto o Moto • Llegada en 8 min</text>
        </g>

        <g transform="translate(210, 18)">
          <rect width="86" height="48" rx="12" fill="#10B981" opacity="0.15" />
          <text x="43" y="28" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#10B981" text-anchor="middle">$10.000</text>
          <text x="43" y="42" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">COP</text>
        </g>
      </g>
    </g>
  </g>

  <!-- URL Inferior -->
  <g transform="translate(100, 560)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#8B949E" letter-spacing="0.05em">
      https://ruta-libre.pages.dev
    </text>
  </g>
</svg>
